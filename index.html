<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDS Controller</title>
<style>
  body {
    background-color: #1e1e1e; 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .eds-panel {
    background-color: #c9d2db;
    padding: 30px;
    width: 540px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    position: relative;
  }

  /* --- TOP ROW --- */
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding: 0 10px;
  }

  .port-wrapper {
    display: flex;
    align-items: center;
  }
  .port-nub {
    width: 10px;
    height: 18px;
    background: #1a1a1a;
    border-top-left-radius: 10px;
    border-bottom-left-radius: 10px;
    margin-right: -2px;
    z-index: 1;
  }
  .port-main {
    width: 45px;
    height: 28px;
    background: #1a1a1a;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }
  .port-slot {
    width: 32px;
    height: 8px;
    background: #000;
    border: 1px solid #333;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
  }
  .gold-pin {
    width: 5px;
    height: 2px;
    background: #c2883a;
  }

  .display-screen {
    background: #0d0d0d;
    border-radius: 6px;
    padding: 10px 25px;
    min-width: 180px;
    text-align: center;
  }
  .led-text {
    color: #ff3333;
    font-family: 'Courier New', Courier, monospace;
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 14px;
    margin-right: -14px;
    text-shadow: 
      1px 1px 0px rgba(0,0,0,0.8),
      0 0 6px rgba(255, 51, 51, 0.8);
  }

  .indicators {
    display: flex;
    gap: 12px;
    text-align: center;
  }
  .led-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .light {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #111;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
  }
  .light.lit-red {
    background: #ff4747;
    box-shadow: 
      inset 0 0 2px #fff,
      0 0 8px #ff4747, 
      0 0 15px #ff4747;
  }
  .led-label {
    font-size: 10px;
    color: #111;
    font-weight: bold;
  }

  /* --- BOTTOM ROW --- */
  .button-section {
    border: 2px solid #1a1a1a;
    border-radius: 10px;
    padding: 18px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
  }

  .label-top {
    position: absolute;
    top: -12px;
    left: 15px;
    background: #c9d2db;
    padding: 0 8px;
    font-size: 18px;
    color: #111;
  }
  .label-top strong {
    font-size: 20px;
    font-weight: 900;
  }

  .label-bottom {
    position: absolute;
    bottom: -9px;
    right: 25px;
    background: #c9d2db;
    padding: 0 8px;
    font-size: 14px;
    font-weight: 900;
    font-style: italic;
    color: #111;
  }

  /* Highly Curved Soft Rectangles Matching the Reference Images */
  .btn {
    background-color: #0d0d0d;
    background-clip: content-box; 
    border: 2px solid #1a1a1a;
    padding: 2px;
    border-radius: 12px; /* Increased border radius for a smoother, curvier look */
    color: #f2f2f2;
    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.15);
    transition: all 0.05s ease;
  }
  
  .btn.text-btn {
    font-size: 10px;
    letter-spacing: 0px;
    text-align: center;
  }

  .btn:active {
    transform: translateY(1px);
    background-color: #1a1a1a;
  }

  /* Custom CSS drawing for the Up/Down Arrow with Slash icon */
  .custom-icon-toggle {
    position: relative;
    width: 18px;
    height: 20px;
  }
  .custom-icon-toggle .arrow-up {
    position: absolute;
    left: 0px;
    top: 2px;
    width: 2px;
    height: 13px;
    background: #fff;
  }
  .custom-icon-toggle .arrow-up::before {
    content: '';
    position: absolute;
    top: 0;
    left: -3px;
    border: solid #fff;
    border-width: 0 3px 3px 0;
    display: inline-block;
    padding: 3px;
    transform: rotate(-135deg);
  }
  .custom-icon-toggle .arrow-down {
    position: absolute;
    right: 0px;
    bottom: 2px;
    width: 2px;
    height: 13px;
    background: #fff;
  }
  .custom-icon-toggle .arrow-down::before {
    content: '';
    position: absolute;
    bottom: 0;
    right: -3px;
    border: solid #fff;
    border-width: 0 3px 3px 0;
    display: inline-block;
    padding: 3px;
    transform: rotate(45deg);
  }
  .custom-icon-toggle .slash {
    position: absolute;
    top: 0px;
    left: 8px;
    width: 2px;
    height: 20px;
    background: #fff;
    transform: rotate(25deg);
  }

</style>
</head>
<body>

<div class="eds-panel">
  
  <div class="top-row">
    <div class="port-wrapper">
      <div class="port-nub"></div>
      <div class="port-main">
        <div class="port-slot">
          <div class="gold-pin"></div>
          <div class="gold-pin"></div>
          <div class="gold-pin"></div>
          <div class="gold-pin"></div>
        </div>
      </div>
    </div>

    <div class="display-screen">
      <div class="led-text" id="display">1111</div>
    </div>

    <div class="indicators">
      <div class="led-col">
        <div class="light lit-red"></div>
        <span class="led-label">Power</span>
      </div>
      <div class="led-col">
        <div class="light" id="com-light"></div>
        <span class="led-label">Con</span>
      </div>
      <div class="led-col">
        <div class="light"></div>
        <span class="led-label" style="font-size: 13px; font-weight: normal;">⇅</span>
      </div>
    </div>
  </div>

  <div class="button-section">
    <div class="label-top"><strong>EDS</strong> Controller</div>
    
    <button class="btn text-btn" id="btn-search">SEARCH</button>
    <button class="btn" id="btn-toggle">
      <div class="custom-icon-toggle">
        <div class="arrow-up"></div>
        <div class="slash"></div>
        <div class="arrow-down"></div>
      </div>
    </button>
    <button class="btn plus-btn">+</button>
    <button class="btn plus-btn">+</button>
    <button class="btn plus-btn">+</button>
    <button class="btn plus-btn">+</button>
    <button class="btn" id="btn-minus">-</button>
    <button class="btn text-btn" id="btn-send">SEND</button>
    
    <div class="label-bottom">COOL-AIR</div>
  </div>

</div>

<script>
  const display = document.getElementById('display');
  const comLight = document.getElementById('com-light');
  let currentVal = 1111;

  document.querySelectorAll('.plus-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentVal = (currentVal + 1) % 10000;
      display.textContent = String(currentVal).padStart(4, '0');
    });
  });

  document.getElementById('btn-minus').addEventListener('click', () => {
    currentVal = (currentVal - 1 + 10000) % 10000;
    display.textContent = String(currentVal).padStart(4, '0');
  });

  document.getElementById('btn-send').addEventListener('click', () => {
    comLight.classList.add('lit-red');
    setTimeout(() => {
      comLight.classList.remove('lit-red');
    }, 400);
  });
</script>

</body>
</html>
