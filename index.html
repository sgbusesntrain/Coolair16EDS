<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDS Controller & Display Container</title>
<style>
  body {
    background-color: #111;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    gap: 20px;
  }

  iframe {
    width: 100%;
    max-width: 900px;
    border: 3px solid #333;
    border-radius: 10px;
    background-color: #121212;
  }

  /* Adjust heights so both fit nicely on screen */
  .controller-frame {
    height: 45%; 
  }

  .eds-frame {
    height: 45%; 
  }
</style>
</head>
<body>

  <!-- Top: Loads your exact controller.html file perfectly untouched -->
  <iframe src="controller.html" class="controller-frame" title="Controller Panel"></iframe>

  <!-- Bottom: Loads your exact eds.html file perfectly untouched -->
  <iframe src="eds.html" class="eds-frame" title="EDS Display"></iframe>

</body>
</html>
