<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolair16 EDS Simulator</title>
<style>
  body {
    background-color: #1a1a1a;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    color: white;
    font-family: sans-serif;
  }

  /* --- LANDING SCREEN (Start View) --- */
  #landing-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
  }

  .load-btn {
    background: #cc6600;
    color: white;
    border: 2px solid #ff8800;
    padding: 20px 40px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    transition: background 0.2s;
  }

  .load-btn:hover {
    background: #e67300;
  }

  /* --- SIMULATOR CONTAINER (Hidden until loaded) --- */
  #simulator-screen {
    display: none; /* Hidden by default */
    flex-direction: column;
    align-items: center;
    gap: 30px;
    width: 100%;
    max-width: 900px;
  }

  /* Controller Panel (Top) */
  .panel-container {
    background-color: #2c2c2c;
    border: 4px solid #444;
    border-radius: 12px;
    padding: 25px;
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  .controller-screen {
    background-color: #000;
    border: 3px inset #555;
    padding: 10px 20px;
    border-radius: 6px;
    color: red;
    font-family: 'Courier New', monospace;
    font-size: 45px;
    font-weight: bold;
    letter-spacing: 15px;
    text-align: center;
    width: 60%;
  }

  .button-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
  }
  
  .panel-btn {
    background: #444;
    color: white;
    border: 2px solid #555;
    border-radius: 6px;
    padding: 20px 0;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
  }
  
  .panel-btn:active {
    background: #222;
  }

  .btn-send {
    background: #cc6600;
    border-color: #ff8800;
  }

  /* EDS Matrix Display (Bottom) */
  .eds-matrix {
    width: 100%;
    height: 160px;
    background-color: #050505;
    border: 6px solid #111;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .eds-text {
    color: #ffaa00;
    font-family: 'Courier New', monospace;
    font-size: 65px;
    font-weight: bold;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <!-- Landing Page State -->
  <div id="landing-screen">
    <h1>Coolair16 EDS System</h1>
    <button type="button" class="load-btn" onclick="loadSimulator()">Load Simulator</button>
  </div>

  <!-- Active Simulator State (Controller on top, EDS set below) -->
  <div id="simulator-screen">
    
    <!-- 1. Controller Panel (Top) -->
    <div class="panel-container">
      <div class="controller-screen" id="controller-display">0000</div>

      <div class="button-grid">
        <button type="button" class="panel-btn" onclick="incrementDigit(1)">+1</button>
        <button type="button" class="panel-btn" onclick="incrementDigit(2)">+2</button>
        <button type="button" class="panel-btn" onclick="incrementDigit(3)">+3</button>
        <button type="button" class="panel-btn" onclick="incrementDigit(4)">+4</button>
        
        <button type="button" class="panel-btn" onclick="btnAction('SRC')">SRC</button>
        <button type="button" class="panel-btn" onclick="btnAction('TOG')">TOG</button>
        <button type="button" class="panel-btn" onclick="clearDigits()">CLR</button>
        <button type="button" class="panel-btn btn-send" onclick="sendRoute()">SEND</button>
      </div>
    </div>

    <!-- 2. EDS Matrix Display (Bottom) -->
    <div class="eds-matrix">
      <div class="eds-text" id="main-matrix">READY</div>
    </div>

  </div>

<script>
  let code = [0, 0, 0, 0];

  function loadSimulator() {
    // Hides the start button screen and shows the simulator interface instantly
    document.getElementById('landing-screen').style.display = 'none';
    document.getElementById('simulator-screen').style.display = 'flex';
  }

  function updateDisplay() {
    document.getElementById('controller-display').innerText = code.join('');
  }

  function incrementDigit(position) {
    let index = position - 1;
    code[index] = (code[index] + 1) % 10;
    updateDisplay();
  }

  function clearDigits() {
    code = [0, 0, 0, 0];
    updateDisplay();
  }

  function btnAction(action) {
    console.log(action + " pressed");
  }

  function sendRoute() {
    let routeCode = code.join('');
    let mainMatrix = document.getElementById('main-matrix');
    
    // Placeholder output until you add your real data later
    mainMatrix.innerText = "CODE: " + routeCode;
  }
</script>

</body>
</html>
