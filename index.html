<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COOL-AIR EDS Controller</title>
<style>
  body {
    background-color: #218c74; 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .eds-panel {
    background: #a9c6e2; /* Matching the slight bluish-silver tint */
    border: 1px solid #777;
    border-radius: 2px;
    padding: 15px 25px 25px 25px;
    position: relative;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5), inset 1px 1px 3px rgba(255, 255, 255, 0.8);
    width: 380px; /* Wider to fit 8 buttons */
  }

  /* Screen and LEDs */
  .screen-bezel {
    background: #111;
    border: 2px solid #000;
    border-radius: 4px;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    box-shadow: inset 0 0 10px #000;
  }

  .sensor {
    width: 25px;
    height: 12px;
    background: #2a2a2a;
    border-radius: 2px;
  }

  .led-display {
    color: #ff3333;
    font-family: 'Courier New', Courier, monospace; 
    font-size: 36px;
    font-weight: bold;
    text-shadow: 
      2px 0 0px #111, -2px 0 0px #111, 0 2px 0px #111, 0 -2px 0px #111,
      0 0 8px #ff0000; /* Simulating the dot-matrix dots slightly */
    letter-spacing: 4px;
    margin: 0 15px;
  }

  .indicators {
    display: flex;
    gap: 10px;
    text-align: center;
  }
  
  .led-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #330000; 
  }
  
  .led.red-on {
    background: #ff3333;
    box-shadow: 0 0 6px #ff3333;
  }

  .led-label {
    font-size: 7px;
    color: #666;
  }

  /* Fieldset used to create the wrapping line with text */
  .button-group {
    border: 1px solid #333;
    border-radius: 4px;
    padding: 10px 5px;
    display: flex;
    justify-content: space-between;
    position: relative;
    margin-top: 15px;
  }

  .legend-title {
    font-size: 12px;
    color: #000;
    padding: 0 5px;
    margin-left: -5px; /* Pull it slightly left to match image */
  }

  .legend-title strong {
    font-size: 14px;
  }

  .brand-bottom {
    position: absolute;
    bottom: -8px;
    right: 15px;
    background: #a9c6e2;
    padding: 0 5px;
    font-size: 10px;
    font-weight: bold;
    font-style: italic;
    color: #333;
  }

  /* 8 Push Buttons */
  .btn {
    background: #111;
    color: #ddd;
    border: 1px solid #000;
    border-radius: 3px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.3);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    padding: 4px 6px;
    min-width: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .btn.text-btn {
    font-size: 10px;
    padding: 4px 8px;
  }
  
  .btn:active {
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.9);
    transform: translateY(2px);
  }
</style>
</head>
<body>

<div class="eds-panel">
  <!-- Main Black Screen Area -->
  <div class="screen-bezel">
    <div class="sensor"></div>
    <div class="led-display">0000</div>
    <div class="indicators">
      <div class="led-group">
        <div class="led red-on"></div>
        <span class="led-label">Power</span>
      </div>
      <div class="led-group">
        <div class="led"></div>
        <span class="led-label">Com</span>
      </div>
      <div class="led-group">
        <div class="led"></div>
        <span class="led-label">N</span>
      </div>
    </div>
  </div>

  <!-- Buttons wrapped in a border with text -->
  <fieldset class="button-group">
    <legend class="legend-title"><strong>EDS</strong> Controller</legend>
    <button class="btn text-btn">SEARCH</button>
    <button class="btn">⇅</button>
    <button class="btn">+</button>
    <button class="btn">+</button>
    <button class="btn">+</button>
    <button class="btn">+</button>
    <button class="btn">-</button>
    <button class="btn text-btn">SEND</button>
    <div class="brand-bottom">COOL-AIR</div>
  </fieldset>
</div>

</body>
</html>
</div>

</body>
</html>
