<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDS Panel Replica</title>
<style>
  /* Simulating the green bus interior background */
  body {
    background-color: #218c74; 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  /* The main white/silver faceplate */
  .eds-panel {
    background: #e6e6e6; 
    border: 1px solid #999;
    border-radius: 2px;
    padding: 15px 25px 25px 25px;
    position: relative;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5), inset 1px 1px 3px rgba(255, 255, 255, 0.8);
    width: 260px;
    font-family: sans-serif;
  }

  /* Corner Mounting Screws */
  .screw {
    width: 8px;
    height: 8px;
    background: #ccc;
    border: 1px solid #777;
    border-radius: 50%;
    position: absolute;
    box-shadow: inset 1px 1px 2px #fff, inset -1px -1px 2px #555;
  }
  
  /* Phillips head cross on the screws */
  .screw::after {
    content: '';
    position: absolute;
    width: 6px;
    height: 1px;
    background: #555;
    top: 3.5px;
    left: 1px;
    transform: rotate(45deg);
  }
  
  .top-left { top: 8px; left: 8px; }
  .top-right { top: 8px; right: 8px; }
  .bottom-left { bottom: 8px; left: 8px; }
  .bottom-right { bottom: 8px; right: 8px; }

  /* Black screen bezel containing the display and lights */
  .screen-bezel {
    background: #111;
    border: 2px solid #000;
    border-radius: 2px;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    box-shadow: inset 0 0 10px #000;
  }

  /* Small sensor/receiver on the left of the screen */
  .sensor {
    width: 12px;
    height: 6px;
    background: #2a2a2a;
    border-radius: 1px;
  }

  /* Glowing Red LED Numbers */
  .led-display {
    color: #ff0000;
    font-family: 'Courier New', Courier, monospace; /* Using monospace to simulate digital font */
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000;
    letter-spacing: 2px;
    line-height: 1;
    margin: 0 15px;
  }

  /* Indicator LEDs on the right side */
  .indicators {
    display: flex;
    gap: 5px;
  }
  
  .led {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #330000; /* Dark red for 'off' state */
  }
  
  .led.red-on {
    background: #ff3333;
    box-shadow: 0 0 4px #ff3333;
  }

  /* Text Labels */
  .labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    font-weight: 800;
    color: #333;
    margin-bottom: 4px;
    padding: 0 10px;
  }

  /* 6 Push Buttons */
  .buttons {
    display: flex;
    justify-content: space-between;
    padding: 0 5px;
  }
  
  .btn {
    width: 22px;
    height: 10px;
    background: #222;
    border: 1px solid #000;
    border-radius: 1px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2);
    cursor: pointer;
  }
  
  .btn:active {
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    transform: translateY(1px);
  }
</style>
</head>
<body>

<div class="eds-panel">
  <!-- Corner Screws -->
  <div class="screw top-left"></div>
  <div class="screw top-right"></div>
  <div class="screw bottom-left"></div>
  <div class="screw bottom-right"></div>

  <!-- Main Black Screen Area -->
  <div class="screen-bezel">
    <div class="sensor"></div>
    <div class="led-display">496</div>
    <div class="indicators">
      <div class="led red-on"></div>
      <div class="led red-on"></div>
      <div class="led"></div>
    </div>
  </div>

  <!-- Printed Text Labels -->
  <div class="labels">
    <span>EDS</span>
    <span>COOLAIR</span>
  </div>

  <!-- Row of Push Buttons -->
  <div class="buttons">
    <div class="btn"></div>
    <div class="btn"></div>
    <div class="btn"></div>
    <div class="btn"></div>
    <div class="btn"></div>
    <div class="btn"></div>
  </div>
</div>

</body>
</html>
