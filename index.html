<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDS Controller Preview</title>
<style>
  body {
    background-color: #1e1e1e; 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .eds-panel {
    background-color: #c9d2db;
    padding: 30px;
    width: 610px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    position: relative;
    box-sizing: border-box;
  }

  /* --- TOP ROW --- */
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding: 0 10px;
  }

  .port-wrapper {
    display: flex;
    align-items: center;
  }
  .port-nub {
    width: 10px;
    height: 18px;
    background: #1a1a1a;
    border-top-left-radius: 10px;
    border-bottom-left-radius: 10px;
    margin-right: -2px;
    z-index: 1;
  }
  .port-main {
    width: 45px;
    height: 28px;
    background: #1a1a1a;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }
  .port-slot {
    width: 32px;
    height: 8px;
    background: #000;
    border: 1px solid #333;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
  }
  .gold-pin {
    width: 5px;
    height: 2px;
    background: #c2883a;
  }

  /* --- DOT MATRIX DISPLAY SCREEN --- */
  .display-screen {
    background: #080808;
    border: 2px solid #1a1a1a;
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
  }

  /* 5x7 Dot Matrix Digit Grid Module */
  .matrix-digit {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: 2px;
    background: #120303;
    padding: 4px;
    border-radius: 3px;
    border: 1px solid #220808;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.8);
  }

  /* Individual Matrix LED Dots */
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #310808;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.9);
  }

  /* Lit LED Dots */
  .dot.on {
    background-color: #ff3333;
    box-shadow: 
      0 0 4px #ff3333,
      0 0 8px #ff1a1a;
  }

  /* LED Indicators */
  .indicators {
    display: flex;
    gap: 12px;
    text-align: center;
  }
  .led-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .light {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #111;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
  }
  .light.lit-red {
    background: #ff4747;
    box-shadow: 
      inset 0 0 2px #fff,
      0 0 8px #ff4747, 
      0 0 15px #ff4747;
  }
  .led-label {
    font-size: 10px;
    color: #111;
    font-weight: bold;
  }

  /* --- BOTTOM BUTTON SECTION --- */
  .button-section {
    border: 2px solid #1a1a1a;
    border-radius: 10px;
    padding: 18px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
  }

  .label-top {
    position: absolute;
    top: -12px;
    left: 15px;
    background: #c9d2db;
    padding: 0 8px;
    font-size: 18px;
    color: #111;
  }
  .label-top strong {
    font-size: 20px;
    font-weight: 900;
  }

  .label-bottom {
    position: absolute;
    bottom: -9px;
    right: 25px;
    background: #c9d2db;
    padding: 0 8px;
    font-size: 14px;
    font-weight: 900;
    font-style: italic;
    color: #111;
  }

  .btn {
    background-color: #0d0d0d;
    background-clip: padding-box; 
    border: 2px solid #1a1a1a;
    outline: 2px solid #f2f2f2;
    outline-offset: -4px;
    border-radius: 10px;
    color: #f2f2f2;
    height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.15);
    box-sizing: border-box;
  }

  .btn.symbol-btn {
    width: 46px;
    flex: 0 0 46px;
    font-size: 38px;
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1; 
  }

  .btn.text-btn {
    width: 76px;
    flex: 0 0 76px;
    font-size: 13.5px;
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    font-weight: bold;
    letter-spacing: -0.2px;
  }

  .toggle-svg {
    width: 26px;
    height: 28px;
  }
</style>
</head>
<body>

      <!-- Digit 0 -->
      <div class="matrix-digit">

        <div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot on"></div>

        <div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot on"></div>
        <div class="dot"></div><div class="dot on"></div><div class="dot on"></div><div class="dot on"></div><div class="dot"></div>
      </div>
      <!-- Digit 0 -->
      <div class="matrix-digit">
        <div class="dot"></div><div class="dot on"></div><div class="dot on"></div><div class="dot on"></div><div class="dot"></div>
        <div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot on"></div>
        <div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot on"></div><div class="dot on"></div>
        <div class="dot on"></div><div class="dot"></div><div class="dot on"></div><div class="dot"></div><div class="dot on"></div>

        <div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot on"></div>
        <div class="dot"></div><div class="dot on"></div><div class="dot on"></div><div class="dot on"></div><div class="dot"></div>
      </div>
    </div>

    <div class="indicators">
      <div class="led-col">
        <div class="light lit-red"></div>

  </div>

  <div class="button-section">
    <div class="label-top"><strong>EDS</strong> Controller</div>
    <button class="btn text-btn">SEARCH</button>
    <button class="btn symbol-btn">
      <svg class="toggle-svg" viewBox="0 0 26 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="18" y1="2" x2="8" y2="26" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="6" y1="22" x2="6" y2="7" stroke="#ffffff" stroke-width="2.2"/>

    <button class="btn symbol-btn">+</button>

</body>
</html>
