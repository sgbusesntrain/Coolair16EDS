<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai CanRun EDS - Matrix Grid Display</title>
<style>
  body {
    background-color: #121212;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    color: #ff8800;
  }

  .eds-container {
    background-color: #1a1a1a;
    padding: 25px;
    border: 3px solid #333;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-sizing: border-box;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .panel-title {
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
    font-weight: bold;
  }

  .bottom-row {
    display: flex;
    gap: 20px;
  }

  /* LED Matrix Screen Base */
  .led-screen {
    background: #050200;
    border: 2px solid #221100;
    border-radius: 6px;
    padding: 8px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.9);
    display: grid;
    gap: 2px;
    box-sizing: border-box;
  }

  /* Individual Dot */
  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background-color: #260c00;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.9);
  }

  .dot.on {
    background-color: #ff6600;
    box-shadow: 0 0 4px #ff6600, 0 0 6px #ff3300;
  }

  /* Proportional Grids */
  .front-panel {
    width: 680px;
    height: 90px;
    grid-template-columns: repeat(160, 1fr);
    grid-template-rows: repeat(16, 1fr);
  }

  .side-panel {
    width: 440px;
    height: 90px;
    grid-template-columns: repeat(96, 1fr);
    grid-template-rows: repeat(16, 1fr);
  }

  .rear-panel {
    width: 200px;
    height: 90px;
    grid-template-columns: repeat(40, 1fr);
    grid-template-rows: repeat(16, 1fr);
  }
</style>
</head>
<body>

<div class="eds-container">

  <!-- FRONT PANEL (160x16) -->
  <div class="panel-section">
    <div class="panel-title">FRONT PANEL (160x16) [Style 6]</div>
    <div class="led-screen front-panel" id="front-grid"></div>
  </div>

  <!-- BOTTOM ROW: SIDE PANEL & REAR PANEL -->
  <div class="bottom-row">
    
    <!-- SIDE PANEL (96x16) -->
    <div class="panel-section">
      <div class="panel-title">SIDE PANEL (96x16) [Style 5]</div>
      <div class="led-screen side-panel" id="side-grid"></div>
    </div>

    <!-- REAR PANEL (40x16) -->
    <div class="panel-section">
      <div class="panel-title">REAR PANEL (40x16) [Style 1]</div>
      <div class="led-screen rear-panel" id="rear-grid"></div>
    </div>

  </div>

</div>

<script>
  // Helper to build dot matrix grids dynamically
  function createGrid(elementId, cols, rows) {
    const container = document.getElementById(elementId);
    const totalDots = cols * rows;
    const dots = [];
    for (let i = 0; i < totalDots; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      container.appendChild(dot);
      dots.push(dot);
    }
    return dots;
  }

  const frontDots = createGrid('front-grid', 160, 16);
  const sideDots = createGrid('side-grid', 96, 16);
  const rearDots = createGrid('rear-grid', 40, 16);

  function setAll(dots, state) {
    dots.forEach(d => {
      if (state) d.classList.add('on');
      else d.classList.remove('on');
    });
  }

  // Listen for storage or messages from the controller
  function checkAndUpdate() {
    const currentCode = localStorage.getItem('eds_code') || '0';
    if (currentCode === '9999') {
      setAll(frontDots, true);
      setAll(sideDots, true);
      setAll(rearDots, true);
    } else {
      setAll(frontDots, false);
      setAll(sideDots, false);
      setAll(rearDots, false);
    }
  }

  window.addEventListener('storage', checkAndUpdate);
  setInterval(checkAndUpdate, 500);
  checkAndUpdate();
</script>

</body>
</html>
