<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolair16 EDS Controller</title>
<style>
  body {
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  /* Container holding the background panel image */
  .panel-container {
    position: relative;
    width: 100%;
    max-width: 900px; /* Adjust based on your image size */
  }

  .panel-container img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Wrapper for all buttons positioned over the image */
  .button-overlay {
    position: absolute;
    /* Adjust these percentages to match where the black box border sits on your image */
    top: 58%; 
    left: 17%;
    width: 66%;
    height: 17%;
    display: flex;
    gap: 1.5%; /* Space between buttons */
    align-items: center;
  }

  /* Individual transparent interactive button style */
  .panel-btn {
    flex: 1;
    height: 100%;
    background: transparent; /* Invisible over the graphic, or use rgba(255,0,0,0.3) for testing alignment */
    border: none;
    cursor: pointer;
    border-radius: 6px;
  }

  /* Optional hover/active effect for feedback */
  .panel-btn:active {
    background: rgba(255, 102, 0, 0.4);
  }
</style>
</head>
<body>

<div class="panel-container">
  <!-- Replace with your actual image path or filename -->
  <img src="your-panel-image.png" alt="Coolair16 Panel">
  
  <div class="button-overlay">
    <button class="panel-btn" onclick="pressButton('SEARCH')"></button>
    <button class="panel-btn" onclick="pressButton('TOGGLE')"></button>
    <button class="panel-btn" onclick="pressButton('+1')"></button>
    <button class="panel-btn" onclick="pressButton('+2')"></button>
    <button class="panel-btn" onclick="pressButton('+3')"></button>
    <button class="panel-btn" onclick="pressButton('+4')"></button>
    <button class="panel-btn" onclick="pressButton('-')"></button>
    <button class="panel-btn" onclick="pressButton('SEND')"></button>
  </div>
</div>

<script>
  function pressButton(action) {
    console.log("Pressed: " + action);
    // Add your logic here for updating the display or sending commands
  }
</script>

</body>
</html>
