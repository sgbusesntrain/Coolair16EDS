<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDS Controller - Coolair16</title>
<style>
  body {
    background-color: #1e1e1e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    color: #ff8800;
  }

  .controller-box {
    background-color: #2b2b2b;
    padding: 30px;
    border: 4px solid #444;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  .screen-display {
    background: #000;
    border: 2px solid #555;
    padding: 15px 25px;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 6px;
    color: #ff6600;
    border-radius: 6px;
    text-shadow: 0 0 10px rgba(255,102,0,0.8);
    min-width: 180px;
    text-align: center;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 12px;
  }

  .btn {
    background-color: #3b3b3b;
    color: #fff;
    border: 2px solid #555;
    padding: 20px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.1s;
  }

  .btn:active {
    background-color: #ff6600;
    color: #000;
  }

  .action-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .btn-action {
    flex: 1;
    padding: 15px;
    font-size: 18px;
    background-color: #442200;
    border-color: #663300;
    color: #ffaa44;
  }
</style>
</head>
<body>

<div class="controller-box">
  <div style="font-size: 14px; color: #aaa; letter-spacing: 2px;">COOLAIR16 CONTROLLER</div>
  <div class="screen-display" id="display">----</div>

  <div class="keypad">
    <button class="btn" onclick="press('1')">1</button>
    <button class="btn" onclick="press('2')">2</button>
    <button class="btn" onclick="press('3')">3</button>
    <button class="btn" onclick="press('4')">4</button>
    <button class="btn" onclick="press('5')">5</button>
    <button class="btn" onclick="press('6')">6</button>
    <button class="btn" onclick="press('7')">7</button>
    <button class="btn" onclick="press('8')">8</button>
    <button class="btn" onclick="press('9')">9</button>
    <button class="btn" onclick="clearInput()">C</button>
    <button class="btn" onclick="press('0')">0</button>
    <button class="btn" onclick="backspace()">⌫</button>
  </div>

  <div class="action-row">
    <button class="btn btn-action" onclick="sendCode()">SEND</button>
  </div>
</div>

<script>
  let currentCode = "";

  function press(num) {
    if (currentCode.length < 4) {
      currentCode += num;
      updateScreen();
    }
  }

  function clearInput() {
    currentCode = "";
    updateScreen();
  }

  function backspace() {
    currentCode = currentCode.slice(0, -1);
    updateScreen();
  }

  function updateScreen() {
    document.getElementById('display').innerText = currentCode.padEnd(4, '-');
  }

  function sendCode() {
    if (currentCode.length > 0) {
      localStorage.setItem('eds_code', currentCode);
      alert('Sent Route Code: ' + currentCode);
    }
  }
</script>

</body>
</html>
